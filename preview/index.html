<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#5289be">
  <meta name="description" content="Lisa · Tu espacio personal bajo un cielo que acompaña tu día. Demostración con datos ficticios.">
  <title>Lisa · Tu espacio personal</title>
  <style>:root{
  --bg:#f4f2ef;--paper:#fff;--glass:rgba(255,255,255,.72);--glass-strong:rgba(255,255,255,.84);
  --ink:#141414;--muted:#74706d;--line:rgba(20,20,20,.11);--line-strong:rgba(20,20,20,.18);
  --red:#df1f2d;--red-dark:#b80f1e;--red-soft:rgba(223,31,45,.09);--black:#111;
  --shadow:0 18px 60px rgba(43,29,25,.12),0 2px 12px rgba(43,29,25,.06);
  --radius:20px;--sidebar-w:244px;--sidebar-mini:72px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
  color:var(--ink);background:var(--bg);color-scheme:light
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{font-size:14px;line-height:1.45;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(80px);pointer-events:none}
body:before{width:420px;height:420px;right:-130px;top:-170px;background:rgba(223,31,45,.17)}
body:after{width:360px;height:360px;left:18%;bottom:-240px;background:rgba(223,31,45,.08)}
button,input,textarea,select{font:inherit}button{color:inherit;cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}
a{color:var(--red)}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--red);outline-offset:3px}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
h1,h2,h3,p{margin:0}h1{font-size:30px;letter-spacing:-1px}h2{font-size:17px;letter-spacing:-.3px}h3{font-size:14px}small,p{color:var(--muted)}
.shell{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:100vh;transition:grid-template-columns .22s ease}
.shell.collapsed{grid-template-columns:var(--sidebar-mini) minmax(0,1fr)}
.sidebar{position:sticky;top:12px;height:calc(100vh - 24px);margin:12px 0 12px 12px;padding:14px 10px;display:flex;flex-direction:column;overflow:hidden;
  background:rgba(250,248,246,.72);backdrop-filter:blur(32px) saturate(150%);-webkit-backdrop-filter:blur(32px) saturate(150%);
  border:1px solid rgba(255,255,255,.85);border-radius:22px;box-shadow:0 12px 42px rgba(35,24,20,.11);z-index:20}
.sidebar-top{display:flex;align-items:center;gap:8px;padding:2px 4px 12px}.brand{flex:1;display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;min-width:0;padding:4px}
.logo{width:34px;height:34px;display:grid;place-items:center;background:var(--red);color:#fff;border-radius:10px;font-weight:750;font-size:20px;box-shadow:0 5px 16px rgba(223,31,45,.25)}
.brand-copy{min-width:0}.brand strong{display:block;font-size:22px;letter-spacing:-.8px}.brand small{font-size:8px;letter-spacing:1.4px;display:block}
.collapse-btn{width:32px;height:32px;border:1px solid var(--line);background:rgba(255,255,255,.58);border-radius:12px;display:grid;place-items:center}
.new-chat{width:100%;min-height:42px;border:1px solid var(--line);background:rgba(255,255,255,.66);border-radius:14px;display:flex;align-items:center;gap:9px;text-align:left;padding:10px 11px;margin-bottom:7px;font-size:12px;font-weight:590}
.new-chat.primary{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 8px 18px rgba(223,31,45,.18)}
.new-chat svg:last-child{margin-left:auto}.nav-group{margin-top:16px}.nav-label{padding:0 10px;margin-bottom:6px;font-size:9px;letter-spacing:1.45px;text-transform:uppercase;color:#918a85;font-weight:700}
.nav-item{width:100%;border:0;background:transparent;border-radius:12px;min-height:38px;padding:8px 10px;display:flex;align-items:center;gap:10px;text-align:left;color:#4f4b48;font-size:12px}
.nav-item:hover{background:rgba(255,255,255,.7)}.nav-item.active{background:rgba(223,31,45,.1);color:var(--red);font-weight:650}.nav-item .dot{margin-left:auto}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor}.sidebar-bottom{margin-top:auto}.profile{display:flex;align-items:center;gap:9px;border-top:1px solid var(--line);padding:13px 8px 0;margin-top:10px}.avatar{width:30px;height:30px;border-radius:9px;background:var(--black);color:white;display:grid;place-items:center;font-size:11px}
.profile strong{display:block;font-size:11px}.profile small{display:block;font-size:9px}
.shell.collapsed .brand-copy,.shell.collapsed .new-chat span,.shell.collapsed .new-chat svg:last-child,.shell.collapsed .nav-label,.shell.collapsed .nav-item span,.shell.collapsed .nav-item .dot,.shell.collapsed .profile div{display:none}
.shell.collapsed .sidebar{padding-inline:8px}.shell.collapsed .brand{flex:0}.shell.collapsed .sidebar-top{justify-content:center;flex-wrap:wrap}.shell.collapsed .collapse-btn{order:2}.shell.collapsed .new-chat,.shell.collapsed .nav-item{justify-content:center;padding-inline:0}.shell.collapsed .profile{justify-content:center}
.main-wrap{min-width:0;padding:12px 12px 12px 14px}.topbar{height:58px;display:flex;align-items:center;gap:14px;padding:0 14px 0 18px;margin-bottom:12px;
  background:rgba(255,255,255,.68);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);
  border:1px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 6px 26px rgba(41,27,23,.06)}
.breadcrumb{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px}.breadcrumb svg{width:12px}.breadcrumb strong{color:var(--ink)}.topbar-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.icon-btn{width:34px;height:34px;border:1px solid var(--line);background:rgba(255,255,255,.62);border-radius:11px;display:inline-flex;align-items:center;justify-content:center}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(223,31,45,.14);background:var(--red-soft);color:var(--red);padding:5px 9px;border-radius:99px;font-size:10px;font-weight:650}.pill.neutral{color:var(--muted);background:rgba(20,20,20,.04);border-color:var(--line)}.pill.warning{color:#8a5a17;background:#fff5df;border-color:#f0ddb6}
.content{padding:0;max-width:none}.demo-note{display:flex;align-items:center;gap:8px;margin:0 0 10px;padding:7px 10px;border:1px solid rgba(20,20,20,.08);background:rgba(255,255,255,.52);border-radius:12px;color:#7d7773;font-size:10px}.demo-note svg{width:13px}
.view-heading{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:8px 6px 18px}.view-heading p{font-size:11px;margin-top:5px}.btn{border:1px solid var(--line);background:#fff;border-radius:3px;min-height:36px;padding:8px 12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:11px;font-weight:590}.btn.primary{background:var(--red);border-color:var(--red);color:white}.btn.danger{color:var(--red)}.btn-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.panel{background:#fff;border:1px solid rgba(20,20,20,.1);border-radius:3px;padding:17px}.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.lower-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:20px 5px 10px}.section-head h2{font-size:14px}.subtle-btn{border:0;background:transparent;color:var(--muted);font-size:10px;display:inline-flex;align-items:center;gap:5px}
.list-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.list-row:last-child{border-bottom:0}.list-row strong{display:block;font-size:11px}.list-row small{display:block;font-size:9px}.list-button{width:100%;border:0;background:transparent;text-align:left}.trailing{margin-left:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chip{border:1px solid var(--line);background:#fff;border-radius:2px;padding:6px 9px;font-size:10px;color:var(--muted)}.chip.active{border-color:var(--red);color:var(--red)}
.file-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.file-card{border:1px solid var(--line);background:#fff;border-radius:3px;padding:12px;text-align:left;min-width:0}.file-cover{height:66px;background:#f5f3f1;display:grid;place-items:center;margin-bottom:10px}.file-card strong{display:block;font-size:10px;overflow-wrap:anywhere}.file-card small,.resource-line{font-size:9px;color:var(--muted)}
.chat-layout{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:12px}.chat-panel{min-height:600px;background:var(--glass-strong);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.9);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}.chat-heading{height:52px;padding:0 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.messages{padding:18px;overflow:auto;flex:1}.message{max-width:86%;font-size:11px;line-height:1.65;margin-bottom:14px;white-space:pre-wrap}.message.user{margin-left:auto;background:var(--red);color:white;padding:10px 12px;border-radius:14px 14px 3px 14px}.message.imported{border-left:2px solid var(--red);padding-left:10px}.message-label{display:block;font-size:8px;color:var(--muted);margin-bottom:4px}.message.user .message-label{color:rgba(255,255,255,.75)}.composer{border-top:1px solid var(--line);padding:10px 12px}.composer textarea{width:100%;border:0;background:transparent;resize:vertical;min-height:48px;outline:0;font-size:11px}.composer-footer{display:flex;align-items:center;justify-content:space-between;gap:8px}.composer-footer small{font-size:8px}.context-card{background:var(--glass);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.9);border-radius:18px;padding:15px;box-shadow:var(--shadow);align-self:start}.context-card p{font-size:10px;line-height:1.55;margin:9px 0}.context-line{display:flex;justify-content:space-between;gap:8px;font-size:9px;padding:8px 0;border-bottom:1px solid var(--line)}.context-card .btn{width:100%;margin-top:6px}
.calendar-toolbar{display:flex;align-items:center;gap:8px;margin:0 5px 10px}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line)}.day-name{font-size:8px;text-transform:uppercase;text-align:center;padding:7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--muted)}.day{min-height:86px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;text-align:left;padding:6px}.day.blank{background:#f7f5f3}.day-number{font-size:9px}.day.today .day-number{display:inline-grid;place-items:center;background:var(--red);color:#fff;width:20px;height:20px;border-radius:50%}.day-event{display:block;margin-top:4px;background:var(--red-soft);color:var(--red);font-size:7px;padding:3px 4px;border-radius:2px;overflow:hidden;text-overflow:ellipsis}
.table-wrap{overflow:auto}.permission-table{border-collapse:collapse;width:100%;font-size:10px}.permission-table th,.permission-table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.permission-table th{color:var(--muted)}
.integration-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.integration-card p{font-size:10px;line-height:1.6;margin:10px 0}.tile-icon{width:34px;height:34px;border-radius:11px;background:var(--red-soft);color:var(--red);display:inline-flex;align-items:center;justify-content:center}.tile-icon.small{width:28px;height:28px;border-radius:9px}
.code{font-family:"SFMono-Regular",Consolas,monospace;background:#111;color:#f3f3f3;border-radius:3px;padding:14px;font-size:9px;white-space:pre-wrap;line-height:1.7}.screen{min-height:300px;background:linear-gradient(135deg,#f6f3f0,#ebe6e2);display:grid;place-items:center;border:1px solid var(--line);border-radius:3px}.screen-inner{text-align:center;max-width:330px}.step{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:10px}.step b{width:22px;height:22px;border-radius:50%;background:var(--red-soft);color:var(--red);display:grid;place-items:center}.step p{font-size:9px;margin-top:4px}
.empty{padding:34px;text-align:center;border:1px dashed var(--line-strong);background:rgba(255,255,255,.5);border-radius:16px}.empty h3{margin:8px 0}.empty p{font-size:10px;max-width:420px;margin:0 auto 12px}
.note-box{padding:10px 12px;background:var(--red-soft);color:#7c343b;border-radius:10px;font-size:10px;margin:10px 0}.note-box.warning{background:#fff4df;color:#875f20}
dialog{border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.88);backdrop-filter:blur(30px);border-radius:20px;padding:22px;width:min(540px,calc(100vw - 28px));box-shadow:0 30px 100px rgba(34,23,20,.22)}dialog::backdrop{background:rgba(24,18,16,.2);backdrop-filter:blur(6px)}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.modal-copy{font-size:10px;line-height:1.65;margin-bottom:12px;white-space:pre-wrap}.field{display:block;font-size:9px;color:var(--muted);margin:10px 0}.field input,.field select,.field textarea{display:block;width:100%;margin-top:5px;border:1px solid var(--line);border-radius:3px;background:#fff;padding:9px;color:var(--ink)}.field textarea{min-height:100px;resize:vertical}.modal-footer{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,90px);background:#111;color:white;border-radius:12px;padding:10px 14px;font-size:10px;z-index:99;transition:transform .2s;box-shadow:0 10px 32px rgba(0,0,0,.18)}#toast.visible{transform:translate(-50%,0)}
.skip-link{position:fixed;top:-60px;left:10px;z-index:100;background:white;padding:8px}.skip-link:focus{top:10px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.mobile-menu,.menu-shade{display:none}.loading{padding:40px;color:var(--muted)}
@media(max-width:1100px){
  .workspace-canvas{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;min-height:auto;overflow:visible}.workspace-window{position:relative!important;left:auto!important;top:auto!important;width:auto!important;height:330px!important}.resize-handle{display:none}.window-bar{cursor:default}
  .integration-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.file-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:760px){
  .shell,.shell.collapsed{display:block}.sidebar{position:fixed;left:8px;top:8px;bottom:8px;height:auto;width:min(268px,calc(100vw - 52px));transform:translateX(-115%);transition:transform .2s;margin:0;z-index:60}.shell.menu-open .sidebar{transform:translateX(0)}.shell.collapsed .brand-copy,.shell.collapsed .new-chat span,.shell.collapsed .nav-label,.shell.collapsed .nav-item span,.shell.collapsed .profile div{display:block}.shell.collapsed .new-chat,.shell.collapsed .nav-item{justify-content:flex-start;padding-inline:10px}
  .menu-shade{display:block;position:fixed;inset:0;border:0;background:rgba(20,20,20,.16);z-index:55;opacity:0;pointer-events:none}.shell.menu-open .menu-shade{opacity:1;pointer-events:auto}.main-wrap{padding:8px}.topbar{height:54px}.mobile-menu{display:inline-flex}.breadcrumb{display:none}.workspace-head{align-items:flex-start;flex-direction:column}.workspace-actions{margin-left:0}.workspace-canvas{grid-template-columns:1fr}.workspace-window{height:310px!important}.demo-note{font-size:9px}
  .grid-2,.split,.lower-grid,.chat-layout{grid-template-columns:1fr}.file-grid,.integration-grid{grid-template-columns:1fr}.context-card{order:-1}.calendar-grid{min-width:650px}.calendar-panel{overflow:auto}.topbar .pill{display:none}
}


/* Lisa v0.4 — dashboard fijo, sin gestor de ventanas */
.eyebrow{font-size:9px;font-weight:750;letter-spacing:1.6px;text-transform:uppercase;color:var(--red);margin-bottom:7px}
.dashboard-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:12px 6px 22px}
.dashboard-head h1{font-size:32px;line-height:1.05;letter-spacing:-1.15px}
.dashboard-head p{margin-top:7px;font-size:11px}
.dashboard-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.dashboard-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.widget{
  min-width:0;background:rgba(255,255,255,.70);
  backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%);
  border:1px solid rgba(255,255,255,.9);border-radius:18px;padding:15px;
  box-shadow:0 10px 32px rgba(43,29,25,.07),inset 0 0 0 1px rgba(20,20,20,.025)
}
.widget-wide{grid-column:span 2}
.widget-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.widget-head h2{font-size:14px;letter-spacing:-.25px;margin-top:1px}
.widget-kicker{display:block;color:var(--red);font-size:8px;letter-spacing:1.25px;text-transform:uppercase;font-weight:750;margin-bottom:3px}
.widget-list{display:flex;flex-direction:column;gap:5px}
.widget-row{
  width:100%;min-height:48px;border:1px solid rgba(20,20,20,.07);border-radius:2px;background:#fff;
  display:flex;align-items:center;gap:9px;padding:7px 9px;text-align:left;color:var(--ink)
}
.widget-row:not(.static):hover{border-color:rgba(223,31,45,.28);background:#fffdfd}
.widget-row>svg:last-child{width:13px;color:#aaa19c;margin-left:auto}
.widget-row.static{cursor:default}
.widget-copy{display:block;min-width:0;flex:1}
.widget-copy strong{display:block;font-size:10px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.widget-copy small{display:block;font-size:8.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.widget-icon,.app-launch-icon{
  width:29px;height:29px;border-radius:10px;background:var(--red-soft);color:var(--red);
  display:grid;place-items:center;flex:0 0 auto
}
.widget-icon svg,.app-launch-icon svg{width:14px;height:14px}
.time-badge{min-width:42px;padding:6px 5px;border-radius:9px;background:var(--red-soft);color:var(--red);font-size:9px;font-weight:750;text-align:center}
.widget-empty{min-height:118px;border:1px dashed var(--line-strong);display:grid;place-items:center;text-align:center;padding:18px;background:rgba(255,255,255,.36);border-radius:13px;color:var(--muted);font-size:10px}
.widget-empty button{border:0;background:transparent;color:var(--red);font-size:10px;font-weight:650}
.app-launch-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.app-launch{
  min-width:0;min-height:67px;border:1px solid rgba(20,20,20,.075);border-radius:2px;background:#fff;
  display:grid;grid-template-columns:30px minmax(0,1fr) 14px;align-items:center;gap:8px;padding:9px;text-align:left
}
.app-launch:hover{border-color:rgba(223,31,45,.28)}
.app-launch>span:nth-child(2){min-width:0}
.app-launch strong{display:block;font-size:10px}
.app-launch small{display:block;font-size:8px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-launch>svg{width:12px;color:#aaa19c}
.footnote{display:flex;align-items:center;gap:7px;color:#9a938e;font-size:8.5px;margin:14px 6px 0}
.footnote svg{width:12px}
.subtle-btn{border:0;background:transparent;color:var(--muted);padding:3px 0;font-size:9px;display:inline-flex;align-items:center;gap:4px}
.subtle-btn:hover{color:var(--red)}
.subtle-btn svg{width:11px}
.sidebar-top{display:flex;align-items:center;gap:6px}
.collapse-btn{flex:0 0 auto}
.shell.collapsed .sidebar-top{flex-direction:column}
.shell.collapsed .brand{justify-content:center;padding-inline:0}
.shell.collapsed .brand-copy{display:none}
.shell.collapsed .collapse-btn{width:36px}
.shell.collapsed .new-chat{padding:9px 0;justify-content:center}
.shell.collapsed .new-chat span,.shell.collapsed .new-chat svg:last-child{display:none}
.shell.collapsed .nav-label,.shell.collapsed .nav-item span,.shell.collapsed .nav-item .dot,.shell.collapsed .profile div{display:none}
.shell.collapsed .nav-item{justify-content:center;padding-inline:0}
.shell.collapsed .profile{justify-content:center}
.shell.collapsed .sidebar{padding-left:8px;padding-right:8px}
@media(max-width:1180px){
  .dashboard-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .widget-wide{grid-column:span 2}
  .app-launch-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:760px){
  .dashboard-head{align-items:flex-start;flex-direction:column;padding:7px 4px 15px}
  .dashboard-head h1{font-size:27px}.dashboard-actions{width:100%}.dashboard-actions .btn{flex:1}
  .dashboard-grid{grid-template-columns:1fr}.widget-wide{grid-column:span 1}
  .app-launch-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:430px){.app-launch-grid{grid-template-columns:1fr}}

/* Lisa v0.4 — fixed application dashboard (no window manager) */
.dashboard-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:12px 6px 18px}
.dashboard-head .eyebrow{font-size:9px;letter-spacing:1.45px;text-transform:uppercase;color:var(--red);font-weight:760;margin-bottom:7px}
.dashboard-head h1{font-size:31px;letter-spacing:-1px}
.dashboard-head p{font-size:11px;margin-top:5px}
.dashboard-actions{display:flex;gap:7px}
.dashboard-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.widget{min-height:205px;padding:15px;background:rgba(255,255,255,.68);backdrop-filter:blur(22px) saturate(145%);-webkit-backdrop-filter:blur(22px) saturate(145%);border:1px solid rgba(255,255,255,.9);border-radius:19px;box-shadow:0 10px 34px rgba(39,27,23,.065)}
.widget-wide{grid-column:span 2}
.widget-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.widget-kicker{display:block;font-size:8px;letter-spacing:1.25px;color:var(--red);font-weight:760;margin-bottom:3px}
.widget-head h2{font-size:15px}
.widget-link{border:0;background:transparent;color:var(--muted);font-size:9px;padding:2px}
.widget-list{display:grid;gap:5px}
.widget-row{width:100%;min-height:43px;display:flex;align-items:center;gap:9px;border:0;background:#fff;padding:8px 9px;text-align:left;border-radius:2px}
.widget-row:not(.static):hover{box-shadow:inset 3px 0 var(--red)}
.widget-main{min-width:0;flex:1}
.widget-main strong{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.widget-main small{display:block;font-size:8.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.widget-icon{min-width:29px;height:29px;border-radius:8px;display:grid;place-items:center;background:var(--red-soft);color:var(--red);font-size:8px;font-weight:780}
.widget-footer{display:flex;gap:7px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.widget-cta{border:0;background:transparent;color:var(--red);font-size:9px;padding:2px}
.widget-cta:last-child{margin-left:auto}
.conversation-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.conversation-card{min-height:86px;border:1px solid var(--line);background:#fff;border-radius:2px;padding:11px;text-align:left;display:flex;gap:10px;align-items:flex-start}
.conversation-card.primary-card{background:var(--red);border-color:var(--red);color:white}
.conversation-mark{font-size:19px;line-height:1}
.conversation-card strong{display:block;font-size:11px;margin-bottom:4px}
.conversation-card small{display:block;font-size:9px;line-height:1.45}
.conversation-card.primary-card small{color:rgba(255,255,255,.78)}
.knowledge-summary{display:flex;align-items:center;gap:12px;padding:22px 4px}
.knowledge-orb{width:48px;height:48px;border-radius:16px;background:var(--red-soft);color:var(--red);display:grid;place-items:center;font-size:20px}
.knowledge-summary strong{display:block;font-size:11px}
.knowledge-summary small{display:block;font-size:9px;max-width:250px;margin-top:3px}
.agent-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.agent-tile{border:1px solid rgba(20,20,20,.07);background:#fff;padding:11px 10px;text-align:left;border-radius:2px;display:flex;align-items:center;gap:8px}
.agent-tile:hover{border-color:rgba(223,31,45,.4)}
.agent-tile>span{width:29px;height:29px;border-radius:9px;background:var(--red-soft);color:var(--red);display:grid;place-items:center;font-size:16px}
.agent-tile strong{font-size:9.5px}
.status-dot{width:7px;height:7px;border-radius:50%;background:#43a96b;flex:none}
.muted-dot{background:#aaa}
.device-summary{display:flex;align-items:center;gap:12px;padding:22px 4px}
.device-hero{width:48px;height:48px;border-radius:15px;background:var(--red-soft);color:var(--red);display:grid;place-items:center;font-size:19px}
.device-summary strong{display:block;font-size:11px}
.device-summary small{display:block;font-size:9px;max-width:230px;margin-top:3px}
.dashboard-footnote{padding:14px 7px 2px;color:var(--muted);font-size:9px}

/* opaque content stays rectilinear; translucent shells stay rounded */
.panel,.file-card,.chip,.quick-card,.widget-row,.conversation-card,.agent-tile{border-radius:2px}
.sidebar,.topbar,.widget,.chat-panel,.context-card,dialog,.demo-note{border-radius:18px}

@media(max-width:1180px){
  .dashboard-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .widget-wide{grid-column:span 2}
  .agent-strip{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:760px){
  .dashboard-head{align-items:flex-start;flex-direction:column}
  .dashboard-actions{width:100%}
  .dashboard-actions .btn{flex:1}
  .dashboard-grid{grid-template-columns:1fr}
  .widget-wide{grid-column:span 1}
  .agent-strip{grid-template-columns:1fr 1fr}
  .conversation-actions{grid-template-columns:1fr}
}

/* Lisa v0.4 · chat de agentes */
.chat-layout-pro{grid-template-columns:minmax(0,1fr) 250px;align-items:start;gap:14px}
.chat-panel-pro{min-height:calc(100vh - 142px);max-height:calc(100vh - 142px);border-radius:22px;background:rgba(255,255,255,.72);backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);border:1px solid rgba(255,255,255,.92);box-shadow:0 18px 58px rgba(43,29,25,.09)}
.chat-heading-pro{height:62px;padding:0 16px;background:rgba(255,255,255,.42);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.agent-heading{display:flex;align-items:center;gap:10px;min-width:0}.agent-heading h2{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}.agent-heading small{font-size:8.5px;color:var(--muted)}
.agent-avatar{width:34px;height:34px;border-radius:12px;background:var(--red-soft);color:var(--red);display:grid;place-items:center}.agent-avatar svg{width:16px}
.chat-heading-actions{margin-left:auto;display:flex;align-items:center;gap:7px}
.messages-pro{padding:18px 22px 10px;scroll-behavior:smooth;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0));}
.message{max-width:none;margin:0 auto 20px;display:grid;grid-template-columns:30px minmax(0,720px);gap:10px;justify-content:center;font-size:11px;line-height:1.65;color:var(--ink);white-space:normal}
.message.user{background:transparent;color:var(--ink);padding:0;border-radius:0;margin-left:auto}
.message.imported{background:transparent;border-left:0;padding:0}
.message-avatar{width:30px;height:30px;border-radius:10px;background:#111;color:#fff;display:grid;place-items:center;font-size:10px;font-weight:750;margin-top:1px}.message.user .message-avatar{background:var(--red)}.message.imported .message-avatar{background:#8e8985}
.message-main{min-width:0;padding-top:1px}.message-meta{display:flex;align-items:center;gap:8px;margin-bottom:5px}.message-meta strong{font-size:10px}.message-meta span{font-size:8px;color:#9a938e}
.message-content{font-size:11px;line-height:1.72;overflow-wrap:anywhere;white-space:normal}.message.user .message-content{display:inline-block;background:#fff;border:1px solid rgba(20,20,20,.08);border-radius:2px;padding:9px 11px;box-shadow:0 2px 8px rgba(20,20,20,.025)}
.message.pending .message-content{opacity:.65}.message.pending .message-avatar{animation:pulse-send 1.2s infinite}
@keyframes pulse-send{0%,100%{opacity:1}50%{opacity:.45}}
.message-actions{display:flex;gap:9px;margin-top:7px;min-height:18px;opacity:0;transition:opacity .15s}.message:hover .message-actions,.message:focus-within .message-actions{opacity:1}.message-actions button{border:0;background:transparent;color:#8a837e;font-size:8.5px;padding:0}.message-actions button:hover{color:var(--red)}
.chat-attachments{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.attachment-chip{display:inline-flex;align-items:center;gap:7px;padding:7px 8px;border:1px solid rgba(20,20,20,.08);background:rgba(255,255,255,.78);border-radius:11px;max-width:240px}.attachment-chip>svg{width:14px;color:var(--red)}.attachment-chip>span{min-width:0}.attachment-chip strong{display:block;font-size:8.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:165px}.attachment-chip small{display:block;font-size:7.5px;margin-top:1px}.attachment-chip button{width:20px;height:20px;border:0;background:transparent;border-radius:7px;display:grid;place-items:center;color:#9a938e}.attachment-chip button:hover{background:rgba(20,20,20,.05);color:var(--red)}.attachment-chip button svg{width:11px}
.chat-empty{display:flex;min-height:340px;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:30px}.chat-empty>svg{width:30px;height:30px;color:var(--red);margin-bottom:12px}.chat-empty h3{font-size:14px;color:var(--ink);margin-bottom:7px}.chat-empty p{font-size:10px;max-width:430px;margin-bottom:14px;line-height:1.7}
.generation-status{display:flex;align-items:center;gap:7px;margin:0 18px 7px;padding:7px 10px;border-radius:11px;background:rgba(223,31,45,.055);color:#7a565a;font-size:8.5px}.generation-status button{margin-left:auto;border:0;background:transparent;color:var(--red);font-size:8.5px}.generation-dot{width:6px;height:6px;border-radius:50%;background:var(--red);animation:pulse-send 1s infinite}
.send-queue{margin:0 18px 8px;padding:9px 10px;border:1px solid rgba(20,20,20,.07);background:rgba(255,255,255,.48);border-radius:13px}.send-queue-title{display:flex;align-items:center;gap:5px;font-size:8px;color:#8d8580;margin-bottom:6px}.send-queue-title svg{width:11px}.queued-message{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid rgba(20,20,20,.05);font-size:8.5px}.queued-message:first-of-type{border-top:0}.queued-message span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.queued-message button{margin-left:auto;width:21px;height:21px;border:0;background:transparent;border-radius:7px;color:#9a938e;display:grid;place-items:center}.queued-message button svg{width:10px}
.composer-pro{border-top:0;padding:4px 16px 14px;background:transparent}.composer-pro>.chat-attachments{max-width:760px;margin:0 auto 7px}
.composer-shell{max-width:780px;margin:0 auto;border:1px solid rgba(20,20,20,.11);background:rgba(255,255,255,.86);border-radius:18px;box-shadow:0 10px 35px rgba(42,28,24,.08);padding:9px 10px 8px;transition:border-color .15s,box-shadow .15s}.composer-shell:focus-within{border-color:rgba(223,31,45,.32);box-shadow:0 12px 38px rgba(42,28,24,.1),0 0 0 3px rgba(223,31,45,.055)}
.composer-pro textarea{display:block;width:100%;min-height:46px;max-height:170px;border:0;background:transparent;resize:none;outline:0;padding:4px 5px 7px;color:var(--ink);font-size:11px;line-height:1.55}.composer-pro textarea::placeholder{color:#aaa29d}
.composer-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px}.composer-tools,.composer-send{display:flex;align-items:center;gap:6px}.composer-icon,.stop-btn,.send-btn{border:0;display:grid;place-items:center}.composer-icon{width:29px;height:29px;border-radius:10px;background:rgba(20,20,20,.045);color:#68615d}.composer-icon:hover{background:var(--red-soft);color:var(--red)}.composer-icon svg{width:14px}
.composer-capability{display:inline-flex;align-items:center;gap:4px;padding:5px 7px;border-radius:9px;background:rgba(20,20,20,.035);color:#857e79;font-size:7.5px}.composer-capability svg{width:10px}
.composer-hint{font-size:7.5px;color:#aaa29d;white-space:nowrap}.composer-hint kbd{font:inherit;border:1px solid rgba(20,20,20,.1);background:#fff;border-radius:4px;padding:1px 4px;color:#817974}
.stop-btn{width:31px;height:31px;border-radius:50%;background:#111;color:#fff}.stop-btn svg{width:12px}.send-btn{width:34px;height:34px;border-radius:50%;background:var(--red);color:white;box-shadow:0 6px 16px rgba(223,31,45,.22)}.send-btn:hover{background:var(--red-dark)}.send-btn svg{width:15px}
.composer-note{max-width:760px;margin:5px auto 0;display:flex;justify-content:space-between;gap:12px;color:#aaa29d;font-size:7.5px;padding:0 3px}
.context-card-pro{position:sticky;top:82px}.context-card-pro .pill{margin:11px 0 5px}.context-card-pro .btn{font-size:9px;min-height:32px}
@media(max-width:1000px){.chat-layout-pro{grid-template-columns:1fr}.context-card-pro{position:static;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.context-card-pro h3,.context-card-pro p,.context-card-pro .pill{grid-column:1/-1}.context-card-pro .context-line{display:none}.chat-panel-pro{min-height:680px;max-height:none}}
@media(max-width:760px){.chat-panel-pro{min-height:calc(100vh - 105px);border-radius:17px}.messages-pro{padding:14px 10px 8px}.message{grid-template-columns:27px minmax(0,1fr);gap:8px}.message-avatar{width:27px;height:27px;border-radius:9px}.message-actions{opacity:1}.chat-heading-actions .pill{display:none}.composer-pro{padding:4px 8px 9px}.composer-shell{border-radius:16px}.composer-hint{display:none}.composer-capability{display:none}.composer-note{font-size:7px}.context-card-pro{display:none}}

/* Proyectos · historial de conversaciones */
.chat-side{display:flex;flex-direction:column;gap:10px;position:sticky;top:82px;align-self:start}
.project-history-card{background:rgba(255,255,255,.72);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);border:1px solid rgba(255,255,255,.92);border-radius:18px;padding:13px;box-shadow:0 14px 44px rgba(43,29,25,.07)}
.project-history-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:1px 1px 10px}.project-kicker{display:block;font-size:7.5px;letter-spacing:1.25px;text-transform:uppercase;color:var(--red);font-weight:750;margin-bottom:2px}.project-history-head h3{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}.project-new{width:27px;height:27px;border:0;background:var(--red);color:#fff;border-radius:9px;display:grid;place-items:center}.project-new svg{width:12px}

.project-history-empty{font-size:8px;color:#aaa29d;padding:7px 4px 10px;line-height:1.5}.project-history-footer{border-top:1px solid rgba(20,20,20,.06);margin-top:8px;padding-top:8px}.project-history-footer button{border:0;background:transparent;color:#918985;font-size:7.5px;padding:0}.project-history-footer button:hover{color:var(--red)}
.chat-side .context-card-pro{position:static}.chat-layout-pro{grid-template-columns:minmax(0,1fr) 260px}
@media(max-width:1000px){.chat-side{position:static}.project-history-card{order:1}.context-card-pro{order:2}.chat-layout-pro{grid-template-columns:1fr}.project-history-card{max-height:260px;overflow:auto}}
@media(max-width:760px){.chat-side{display:block}.project-history-card{margin-top:8px}.project-history-card+.context-card-pro{display:none}}

/* Conocimiento · lector/editor Markdown */
.knowledge-shell{display:grid;grid-template-columns:250px minmax(0,1fr) 210px;gap:12px;align-items:start}
.knowledge-library,.knowledge-reader,.knowledge-outline-card{background:rgba(255,255,255,.72);backdrop-filter:blur(26px) saturate(145%);-webkit-backdrop-filter:blur(26px) saturate(145%);border:1px solid rgba(255,255,255,.92);box-shadow:0 12px 40px rgba(43,29,25,.07)}
.knowledge-library{border-radius:18px;padding:13px;position:sticky;top:82px;max-height:calc(100vh - 104px);overflow:auto}.knowledge-library-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.knowledge-library-head h2{font-size:13px}.knowledge-kicker{display:block;font-size:7.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--red);font-weight:750;margin-bottom:2px}
.knowledge-search{height:35px;display:flex;align-items:center;gap:7px;border:1px solid rgba(20,20,20,.08);background:#fff;border-radius:11px;padding:0 9px;margin-bottom:8px}.knowledge-search svg{width:13px;color:#a39b96}.knowledge-search input{min-width:0;width:100%;border:0;outline:0;background:transparent;font-size:9px;color:var(--ink)}

.knowledge-list{display:flex;flex-direction:column;gap:3px}.knowledge-list-item{width:100%;display:grid;grid-template-columns:28px minmax(0,1fr);gap:7px;align-items:center;border:0;background:transparent;border-radius:11px;padding:7px;text-align:left}.knowledge-list-item:hover{background:rgba(20,20,20,.035)}.knowledge-list-item.active{background:rgba(223,31,45,.075)}.knowledge-doc-icon{width:28px;height:28px;border-radius:9px;background:rgba(20,20,20,.045);color:#847d78;display:grid;place-items:center}.knowledge-list-item.active .knowledge-doc-icon{background:var(--red-soft);color:var(--red)}.knowledge-doc-icon svg{width:13px}.knowledge-list-item strong{display:block;font-size:8.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.knowledge-list-item small{display:block;font-size:7px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.knowledge-list-empty{padding:18px 8px;color:#a29a95;font-size:8px;text-align:center}
.knowledge-reader{border-radius:20px;min-height:680px;overflow:hidden}.knowledge-doc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:22px 28px 17px;border-bottom:1px solid rgba(20,20,20,.065);background:rgba(255,255,255,.45)}.knowledge-doc-head h1{font-size:25px;line-height:1.14;letter-spacing:-.7px;margin:9px 0 5px}.knowledge-doc-head p{font-size:8.5px}.knowledge-badges{display:flex;gap:5px;flex-wrap:wrap}

  <script type="module">// MODULE: domain.mjs
/** Lisa v0.3. Pure demo domain. These checks are NOT a server security boundary. */
const AREAS = [
  { id: 'vivienda', name: 'Vivienda', icon: 'home', color: 'amber', description: 'Documentos, recibos y gestiones del hogar.' },
  { id: 'universidad', name: 'Universidad', icon: 'book', color: 'blue', description: 'Apuntes, asignaturas y organización académica.' },
  { id: 'finanzas', name: 'Finanzas', icon: 'chart', color: 'green', description: 'Facturas, presupuestos y documentación financiera.' },
  { id: 'personal', name: 'Personal', icon: 'user', color: 'purple', description: 'Planes, ideas y las cosas del día a día.' },
  { id: 'familia', name: 'Familia', icon: 'heart', color: 'rose', description: 'Información y gestiones familiares, en su lugar.' }
];
const PROJECTS = [
  {id:'demo-project-vivienda',name:'Vivienda · Proyecto',category:'vivienda',agentId:'vivienda'},
  {id:'demo-project-universidad',name:'Universidad · Proyecto',category:'universidad',agentId:'universidad'},
  {id:'demo-project-finanzas',name:'Finanzas · Proyecto',category:'finanzas',agentId:'finanzas'},
  {id:'demo-project-personal',name:'Personal · Proyecto',category:'personal',agentId:'personal'},
  {id:'demo-project-familia',name:'Familia · Proyecto',category:'familia',agentId:'familia'}
];
const uid = () => {
  if (globalThis.crypto.randomUUID) return globalThis.crypto.randomUUID();
  const b = globalThis.crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
};
const copy = value => structuredClone(value);
function categoryOK(value) { return value === 'general' || AREAS.some(a => a.id === value); }
function text(value, max = 8000) {
  if (typeof value !== 'string' || !value.trim() || value.length > max) throw new Error(`Introduce entre 1 y ${max} caracteres.`);
  return value.trim();
}
function createConversation(mode, agentId = null, projectId = null) {
  if (!['general', 'sandbox', 'agent'].includes(mode)) throw new Error('Modo desconocido.');
  if (mode === 'agent' && !AREAS.some(a => a.id === agentId)) throw new Error('Agente desconocido.');
  if (projectId && !PROJECTS.some(p => p.id === projectId)) throw new Error('Proyecto desconocido.');
  const now = new Date().toISOString();
  return { id: uid(), mode, agentId: mode === 'agent' ? agentId : null, category: mode === 'agent' ? agentId : 'general', projectId, pinned:false, archived:false, title: 'Nueva conversación', saved: Boolean(projectId), revision: 1, messages: [], createdAt: now, updatedAt: now, sourceId: null };
}
function saveConversation(chat, category = chat.category) {
  if (!categoryOK(category)) throw new Error('Categoría desconocida.');
  return { ...copy(chat), saved: true, category, revision: chat.revision + 1 };
}
function promoteConversation(chat, target) {
  if (!categoryOK(target)) throw new Error('Destino desconocido.');
  const result = createConversation(target === 'general' ? 'general' : 'agent', target);
  result.title = chat.title;
  result.sourceId = chat.id;
  result.projectId = null;
  result.saved = false;
  // Imports remain untrusted text, never executable tool calls or system instructions.
  result.messages = chat.messages.map(m => ({ id: uid(), role: 'imported', content: m.content, sourceRole: m.role, trust: 'untrusted' }));
  return result;
}
function escapeHtml(value) { return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }

const FINANCE_TYPES = ['Fondo','ETF','Acción','Renta fija','Efectivo','Cripto','Otro'];
function financeFinite(value,label,{positive=false,nonNegative=false}={}) {
  const n=Number(value);
  if(!Number.isFinite(n) || (positive && n<=0) || (nonNegative && n<0)) throw new Error(`${label} inválido.`);
  return n;
}
function normalizeFinancePosition(input,id=uid()) {
  const type=String(input?.type||'Otro');
  if(!FINANCE_TYPES.includes(type)) throw new Error('Tipo de activo desconocido.');
  const currency=String(input?.currency||'EUR').trim().toUpperCase();

      if(response.status===204) return null;
      const payload=await response.json();

      return payload.data;
    } catch(error) {
      if(error.name==='AbortError') throw new Error('La API no respondió a tiempo. No se ha reintentado la acción.');

    skySet('px','0px');skySet('py','0px');

    if(!skyRoot)return;

  document.addEventListener('input',event=>{if(event.target.matches('[data-sky-slider]')){skyPreview=Number(event.target.value)/60;skyPaint();}});
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&skyRoot&&!skyRoot.querySelector('[data-sky-panel]').hidden){skyClose();skyRoot.querySelector('[data-sky-toggle]').focus();}});
  document.addEventListener('pointermove',event=>{
    if(!skyRoot||document.hidden||skyPaused||skyMedia.matches||event.pointerType!=='mouse'||skyFrame)return;

function knowledgeSlug(value){
  return String(value||'seccion').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,80)||'seccion';
}
function safeMarkdownHref(value){
  const href=String(value||'').trim();
  if(href.startsWith('#')||href.startsWith('/')||/^https?:\/\//i.test(href)||/^mailto:/i.test(href))return href;
  return '#';
}
function markdownInline(raw){
  let source=String(raw??'');
  const tokens=[];
  const token=html=>{const key=`@@MDTOKEN${tokens.length}@@`;tokens.push(html);return key;};
  source=source.replace(/`([^`\n]+)`/g,(_,code)=>token(`<code>${e(code)}</code>`));
  source=source.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+["'][^"']*["'])?\)/g,(_,label,href)=>token(`<a href="${e(safeMarkdownHref(href))}" rel="noopener noreferrer">${e(label)}</a>`));
  let html=e(source);
  html=html.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
           .replace(/__([^_]+)__/g,'<strong>$1</strong>')
           .replace(/~~([^~]+)~~/g,'<del>$1</del>')
           .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
           .replace(/(^|[^_])_([^_\n]+)_/g,'$1<em>$2</em>');
  tokens.forEach((value,index)=>{html=html.replaceAll(`@@MDTOKEN${index}@@`,value);});
  return html;
}
function markdownHeadings(markdown){
  const result=[];let fenced=false;
  for(const line of String(markdown||'').replace(/\r/g,'').split('\n')){
    if(/^\s*```/.test(line)){fenced=!fenced;continue;}
    if(fenced)continue;
    const match=line.match(/^(#{1,6})\s+(.+)$/);
    if(match)result.push({level:match[1].length,text:match[2].replace(/[*_`~]/g,'').trim(),id:knowledgeSlug(match[2])});
  }
  return result;
}
function markdownReader(markdown){
  const lines=String(markdown||'').replace(/\r/g,'').split('\n');let html='',i=0;
  const isBlock=line=>/^\s*(#{1,6})\s+/.test(line)||/^\s*```/.test(line)||/^\s*>/.test(line)||/^\s*[-+*]\s+/.test(line)||/^\s*\d+[.)]\s+/.test(line)||/^\s*(---+|___+|\*\*\*+)\s*$/.test(line);
  while(i<lines.length){
    const line=lines[i];
    if(!line.trim()){i++;continue;}
    const fence=line.match(/^\s*```([\w-]*)\s*$/);
    if(fence){
      const language=fence[1]||'text',body=[];i++;
      while(i<lines.length&&!/^\s*```/.test(lines[i]))body.push(lines[i++]);
      if(i<lines.length)i++;
      html+=`<div class="md-code"><div class="md-code-head">${e(language)}</div><pre><code>${e(body.join('\n'))}</code></pre></div>`;continue;
    }
    const heading=line.match(/^(#{1,6})\s+(.+)$/);
    if(heading){const level=heading[1].length,id=knowledgeSlug(heading[2]);html+=`<h${level} id="${e(id)}">${markdownInline(heading[2])}</h${level}>`;i++;continue;}
    if(i+1<lines.length&&line.includes('|')&&/^\s*\|?\s*:?-{3,}/.test(lines[i+1])){
      const header=line.replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
      i+=2;const rows=[];
      while(i<lines.length&&lines[i].includes('|')&&lines[i].trim()){rows.push(lines[i].replace(/^\||\|$/g,'').split('|').map(x=>x.trim()));i++;}
      html+=`<div class="md-table-wrap"><table><thead><tr>${header.map(c=>`<th>${markdownInline(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${header.map((_,idx)=>`<td>${markdownInline(row[idx]||'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;continue;
    }
    if(/^\s*>/.test(line)){
      const quote=[];while(i<lines.length&&/^\s*>/.test(lines[i]))quote.push(lines[i++].replace(/^\s*>\s?/,''));html+=`<blockquote>${quote.map(markdownInline).join('<br>')}</blockquote>`;continue;
    }
    if(/^\s*[-+*]\s+/.test(line)){
      const items=[];while(i<lines.length&&/^\s*[-+*]\s+/.test(lines[i])){const body=lines[i++].replace(/^\s*[-+*]\s+/,'');const task=body.match(/^\[([ xX])\]\s+(.*)$/);items.push(task?`<li class="task-list-item"><input type="checkbox" disabled ${task[1].toLowerCase()==='x'?'checked':''}><span>${markdownInline(task[2])}</span></li>`:`<li>${markdownInline(body)}</li>`);}html+=`<ul>${items.join('')}</ul>`;continue;
    }
    if(/^\s*\d+[.)]\s+/.test(line)){
      const items=[];while(i<lines.length&&/^\s*\d+[.)]\s+/.test(lines[i]))items.push(`<li>${markdownInline(lines[i++].replace(/^\s*\d+[.)]\s+/,''))}</li>`);html+=`<ol>${items.join('')}</ol>`;continue;
    }
    if(/^\s*(---+|___+|\*\*\*+)\s*$/.test(line)){html+='<hr>';i++;continue;}
    const paragraph=[line.trim()];i++;
    while(i<lines.length&&lines[i].trim()&&!isBlock(lines[i])&&!(i+1<lines.length&&lines[i].includes('|')&&/^\s*\|?\s*:?-{3,}/.test(lines[i+1])))paragraph.push(lines[i++].trim());
    html+=`<p>${paragraph.map(markdownInline).join('<br>')}</p>`;
  }
  return html;
}

async function handleAction(action,target){
 if(action==='close'){dialog.close();return;}

 if(action==='archive-chat'){const id=target.dataset.chatId;await api.request('PATCH',`/chats/${id}`,{archived:true});if(id===state.chatId){const c=await api.request('GET',`/chats/${id}`);const list=c.projectId?await api.request('GET',`/chats?projectId=${encodeURIComponent(c.projectId)}`):[];state.chatId=list[0]?.id||null;if(!state.chatId){const projects=await api.request('GET','/projects');const project=projects.find(p=>p.id===c.projectId);if(project) return newChat('agent',project.agentId,project.id);}}await render();toast('Conversación archivada.');return;}
 if(action==='sample'){const draft=composerState();draft.text='¿Cómo podría organizar mis ideas en este espacio?';const box=document.querySelector('#message');if(box){box.value=draft.text;box.focus();}return;}

 if(action==='remove-attachment'){const draft=composerState();draft.attachments=draft.attachments.filter(file=>file.id!==target.dataset.attachment);await render();document.querySelector('#message')?.focus();return;}
 if(action==='cancel-queued'){const flow=sendingState();const index=Number(target.dataset.queueIndex);if(Number.isInteger(index)&&index>=0)flow.queue.splice(index,1);await render();return;}
 if(action==='stop-generation'){const flow=sendingState();if(flow.token)flow.token.cancelled=true;const active=flow.sending;flow.busy=false;flow.sending=null;flow.token=null;if(active){const draft=composerState();if(!draft.text&&!draft.attachments.length){draft.text=active.content||'';draft.attachments=[...(active.attachments||[])];}else{flow.queue.unshift(active);}}await render();toast('Envío detenido. El borrador se ha recuperado.');return;}
 if(action==='copy-message'||action==='reuse-message'||action==='retry-message'){const c=await api.request('GET',`/chats/${state.chatId}`);let message=c.messages.find(m=>m.id===target.dataset.message);if(action==='retry-message'){const index=c.messages.findIndex(m=>m.id===target.dataset.message);message=[...c.messages.slice(0,index)].reverse().find(m=>m.role==='user');}if(!message)return;if(action==='copy-message'){if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(message.content||'');toast('Mensaje copiado.');return;}const draft=composerState();draft.text=message.content||'';draft.attachments=(message.attachments||[]).map(file=>({...file,id:globalThis.crypto?.randomUUID?.()||file.id}));await render();document.querySelector('#message')?.focus();toast(action==='retry-message'?'Mensaje preparado para reintentar.':'Mensaje cargado para editar y reenviar.');return;}
 if(action==='save-chat'){const c=await api.request('GET',`/chats/${state.chatId}`);await api.request('POST',`/chats/${c.id}/save`,{category:c.category,expectedRevision:c.revision});await render();toast('Guardado en el historial de la demo. No se ha añadido conocimiento.');return;}
 if(action==='categorize'||action==='promote'){const c=await api.request('GET',`/chats/${state.chatId}`);modal(action==='promote'?'Continuar con otro agente':'Guardar en una categoría',`<p class="modal-copy">${action==='promote'?'Se crea una conversación nueva. La original no cambia de permisos. El texto importado se trata como contenido no confiable.':'Solo cambia la clasificación en el historial. Un chat Sandbox continúa siendo Sandbox.'}</p><form data-form="${action}"><label class="field">Destino<select name="target">${options(c.category)}</select></label><div class="note-box">${action==='promote'?'La nueva conversación empieza sin guardar. No se transfieren cookies, herramientas, credenciales ni archivos.':'Guardar no añade el contenido a la memoria personal.'}</div><div class="modal-footer"><button class="btn primary" type="submit">${action==='promote'?'Crear nueva conversación':'Guardar aquí'}</button></div></form>`);return;}

 if(action==='integration'||action==='nextcloud'){const id=action==='nextcloud'?'nextcloud':target.dataset.id;modal(`Integración: ${id}`,`<p class="modal-copy">Estado: pendiente de implementación y pruebas con el servicio real.</p><pre class="code">UI → Lisa API → autorización → adaptador\n\n${e(id)}\n\nSin tokens ni credenciales en el frontend.\nLa conexión se configurará en el servidor.</pre><p class="modal-copy">Las capacidades se publicarán desde /api/v1/bootstrap. El contrato completo está en contracts/openapi.mjs y en la especificación del repositorio.</p>${btn('Conexión no disponible en demo','none','','disabled')}`);return;}

 }catch(error){toast(error.message||'No se pudo completar la acción.');}});
document.addEventListener('submit',async ev=>{const form=ev.target;if(!form.dataset.form)return;ev.preventDefault();const body=Object.fromEntries(new FormData(form));const kind=form.dataset.form;try{
 if(kind==='message'){const chatId=state.chatId,draft=composerState(chatId),content=String(body.content||'').trim(),attachments=[...draft.attachments];if(!content&&!attachments.length)return;const payload={content,attachments};draft.text='';draft.attachments=[];const flow=sendingState(chatId);if(flow.busy){flow.queue.push(payload);await render();document.querySelector('#message')?.focus();toast('Mensaje añadido a la cola.');return;}await sendChatPayload(chatId,payload);document.querySelector('#message')?.focus();return;}
 if(kind==='search'){state.filter=body.query;await render();return;}
 if(kind==='categorize'){const c=await api.request('GET',`/chats/${state.chatId}`);await api.request('POST',`/chats/${c.id}/save`,{category:body.target,expectedRevision:c.revision});dialog.close();await render();toast('Clasificado sin cambiar el modo ni los permisos.');return;}
 if(kind==='promote'){const c=await api.request('POST',`/chats/${state.chatId}/promotions`,{target:body.target,selectedAttachmentIds:[]});state.chatId=c.id;dialog.close();await render();toast('Nueva conversación creada. La original no ha cambiado.');return;}
 if(kind==='knowledge'){await api.request('POST',`/chats/${state.chatId}/knowledge-proposals`,body);dialog.close();nav('knowledge');toast('Propuesta creada; falta tu aprobación.');return;}
 if(kind==='knowledge-edit'){const updated=await api.request('PATCH',`/knowledge/${body.id}`,{title:body.title,content:body.content,expectedRevision:Number(body.expectedRevision)});state.knowledgeId=updated.id;state.knowledgeMode='read';await render();toast(`Memoria actualizada · revisión v${updated.revision}.`);return;}
 if(kind==='task'){await api.request('POST','/tasks',body);dialog.close();await render();toast('Tarea creada en la demo.');return;}
 if(kind==='event'){await api.request('POST','/events',body);dialog.close();await render();toast('Evento de ejemplo creado.');return;}
 if(kind==='finance-position'){const id=String(body.id||'');delete body.id;if(id)await api.request('PATCH',`/finance/positions/${id}`,body);else await api.request('POST','/finance/positions',body);dialog.close();await render();toast(id?'Posición actualizada.':'Posición añadida a la demo.');return;}
 if(kind==='developer'){dialog.close();modal('Propuesta · sin ejecutar',`<p class="modal-copy">${e(body.content)}</p><pre class="code">Estado: propuesta de demostración\nDestino: nueva rama de código\nDatos: solo fixtures\nValidaciones: tests, diff, preview\nPublicación: aprobación humana</pre><div class="modal-footer">${btn('Cerrar','close')}${btn('Aplicar · backend pendiente','none','primary','disabled')}</div>`);return;}
 }catch(error){toast(error.message||'No se pudo completar la operación.');}});
document.addEventListener('input',ev=>{if(ev.target?.id==='message')composerState().text=ev.target.value;if(ev.target?.id==='knowledge-search'){state.knowledgeQuery=ev.target.value;clearTimeout(globalThis.__knowledgeSearchTimer);globalThis.__knowledgeSearchTimer=setTimeout(()=>render().catch(error=>toast(error.message)),180);}if(ev.target?.id==='knowledge-markdown'){const preview=document.querySelector('#knowledge-live-preview');if(preview)preview.innerHTML=markdownReader(ev.target.value);}});
document.addEventListener('change',async ev=>{if(ev.target?.id!=='chat-files')return;stageFiles(ev.target.files||[]);ev.target.value='';await render();document.querySelector('#message')?.focus();});
document.addEventListener('keydown',ev=>{if(ev.target?.id!=='message'||ev.isComposing)return;if(ev.key==='Enter'&&!ev.shiftKey&&window.innerWidth>760){ev.preventDefault();ev.target.form?.requestSubmit();}});
document.addEventListener('paste',async ev=>{if(ev.target?.id!=='message')return;const files=[...(ev.clipboardData?.files||[])];if(!files.length)return;ev.preventDefault();stageFiles(files);await render();document.querySelector('#message')?.focus();});
document.addEventListener('dragover',ev=>{if(ev.target.closest?.('[data-dropzone="chat"]'))ev.preventDefault();});
document.addEventListener('drop',async ev=>{if(!ev.target.closest?.('[data-dropzone="chat"]'))return;ev.preventDefault();const files=[...(ev.dataTransfer?.files||[])];if(!files.length)return;stageFiles(files);await render();document.querySelector('#message')?.focus();});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(views[v]){state.view=v;render().catch(err=>toast(err.message));}});
const initial=location.hash.slice(1);if(views[initial])state.view=initial;
render().catch(error=>{mount.textContent=`No se pudo iniciar Lisa: ${error.message}`;});
</script>
</body>
</html>
