<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#6CA5D7">
  <meta name="description" content="Lisa · Tu espacio personal bajo un cielo que acompaña tu día. Demostración con datos ficticios.">
  <title>Lisa · Tu espacio personal</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./sky.css">
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <div id="app"><p class="loading">Preparando Lisa…</p></div>

  <template id="home-dashboard">
    <section id="sky-home" class="zk-home" aria-label="Inicio de Lisa">
      <div class="zk-stage">
        <div class="sky-world" aria-hidden="true">
          <div class="sky-gradient"></div>
          <div class="sky-grain"></div>
          <div class="sky-stars" data-sky-stars></div>
          <div class="sky-sun"><span></span></div>
          <div class="sky-moon"></div>

          <svg class="zk-high-clouds zk-high-clouds-a" viewBox="0 0 520 130" preserveAspectRatio="none">
            <path d="M0 92c33-29 71-32 102-17 16-27 48-43 84-36 33 6 46 25 54 43 27-15 63-13 83 6 10 9 15 19 17 28H0Z"/>
          </svg>
          <svg class="zk-high-clouds zk-high-clouds-b" viewBox="0 0 560 130" preserveAspectRatio="none">
            <path d="M0 95c31-22 68-31 101-20 20-35 61-51 99-40 24 7 38 22 48 42 34-17 77-12 97 11 8 9 13 18 15 27H0Z"/>
          </svg>

          <svg class="zk-horizon" viewBox="0 0 1600 460" preserveAspectRatio="none">
            <path class="zk-horizon-back" d="M0 317c88-31 160-28 230 4 81 36 135 25 207-27 76-55 156-43 245 12 86 53 161 58 241 12 91-51 159-64 239-24 97 49 175 39 242-14 72-56 129-61 196-31v211H0Z"/>
            <path class="zk-horizon-front" d="M0 351c110-64 198-51 282 8 61 42 119 40 188-13 91-70 190-74 302 1 88 59 163 63 256 7 96-58 181-50 260 8 69 51 139 53 219 16 36-16 65-22 93-19v101H0Z"/>
          </svg>

          <svg class="zk-paper-trails" viewBox="0 0 1600 720">
            <path d="M115 514c83-6 129 43 210 31 44-7 66-32 89-57"/>
            <path d="M1085 550c61-11 99 12 140 31 68 31 120 18 181-32"/>
            <path d="M1317 463c34-34 68-51 116-57"/>
          </svg>
        </div>

        <header class="zk-topbar">
          <div class="zk-location">
            <span class="zk-pin">⌖</span>
            <span>LISA · TU ESPACIO PERSONAL</span>
          </div>

          <nav class="zk-nav sky-glass" aria-label="Navegación principal de Inicio">
            <button class="zk-nav-avatar" data-nav="home" aria-label="Inicio">L</button>
            <button data-nav="files">Archivos</button>
            <button data-nav="knowledge">Conocimiento</button>
            <button data-nav="agents">Agentes</button>
            <button class="zk-nav-cta" data-new="general"><span>✉</span> Hablar con Lisa</button>
          </nav>

          <div class="zk-controls">
            <div class="sky-time-control">
              <button class="zk-circle-control sky-glass" data-sky-toggle aria-expanded="false" aria-controls="sky-time-panel" aria-label="Cambiar la hora del paisaje">
                <time data-sky-clock>--:--</time>
              </button>
              <section class="sky-time-panel sky-glass" id="sky-time-panel" data-sky-panel hidden aria-label="La luz de tu espacio">
                <div class="sky-panel-heading"><strong>La luz de Lisa</strong><output data-sky-output>--:--</output></div>
                <p>La escena cambia con la hora de tu dispositivo. También puedes recorrer el día manualmente.</p>
                <label class="sky-range-label" for="sky-time-slider">Hora del paisaje</label>
                <input id="sky-time-slider" data-sky-slider type="range" min="0" max="1439" step="1" value="720" aria-valuetext="12:00">
                <div class="sky-range-ticks"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
                <div class="sky-time-presets">
                  <button data-sky-preset="7" aria-pressed="false">Amanecer</button>
                  <button data-sky-preset="13" aria-pressed="false">Día</button>
                  <button data-sky-preset="19" aria-pressed="false">Atardecer</button>
                  <button data-sky-preset="23" aria-pressed="false">Noche</button>
                </div>
                <button class="sky-live-button" data-sky-live aria-pressed="true"><span class="sky-live-dot"></span>Usar la hora real</button>
                <small><span data-sky-timezone></span> · <span data-sky-phase>Cielo</span></small>
              </section>
            </div>
            <button class="zk-circle-control zk-motion sky-glass" data-sky-motion aria-pressed="true" aria-label="Pausar movimiento del cielo" title="Pausar movimiento">
              <span class="zk-sun-mini"></span>
            </button>
          </div>
        </header>

        <div class="zk-vertical-copy" aria-hidden="true">ARCHIVOS / IDEAS / AGENTES</div>

        <main class="zk-hero">
          <div class="zk-kicker"><span></span><span data-sky-greeting>Hola de nuevo.</span> TU MUNDO, EN UN SOLO LUGAR.</div>

          <h1>
            <span class="zk-line"><span class="zk-accent">L</span>isa, un espacio</span>
            <span class="zk-line zk-line-two">para todo lo tuyo.</span>
          </h1>

          <div class="zk-command-deck sky-glass">
            <div class="zk-orb zk-orb-left"><span>✦</span></div>
            <button class="zk-command-main" data-new="general">
              <span class="zk-command-kicker">PREGUNTA, BUSCA, ORGANIZA O DELEGA</span>
              <strong>¿Qué tienes en mente?</strong>
              <small>Lisa puede empezar desde aquí.</small>
            </button>
            <div class="zk-command-meter" aria-hidden="true">
              <span></span><span></span><span></span><span></span><span></span>
            </div>
            <button class="zk-command-go" data-new="general" aria-label="Hablar con Lisa">↗</button>
            <div class="zk-orb zk-orb-right"><span>◌</span></div>
          </div>

          <div class="zk-quick-links" aria-label="Accesos rápidos">
            <button data-nav="history">Conversaciones <span>↗</span></button>
            <button data-nav="tasks">Tareas <span>↗</span></button>
            <button data-nav="calendar">Tu día <span>↗</span></button>
            <button data-nav="settings">Ajustes <span>↗</span></button>
          </div>
        </main>

        <button class="zk-plane zk-plane-left" data-nav="files" aria-label="Abrir Archivos">
          <span>ARCHIVOS</span>
          <svg viewBox="0 0 150 55"><path d="M4 26 142 5 95 48 63 34 39 45 44 30Z"/></svg>
        </button>
        <button class="zk-plane zk-plane-center" data-nav="knowledge" aria-label="Abrir Conocimiento">
          <span>CONOCIMIENTO</span>
          <svg viewBox="0 0 150 55"><path d="M4 26 142 5 95 48 63 34 39 45 44 30Z"/></svg>
        </button>
        <button class="zk-plane zk-plane-right" data-nav="agents" aria-label="Abrir Agentes">
          <span>AGENTES</span>
          <svg viewBox="0 0 150 55"><path d="M4 26 142 5 95 48 63 34 39 45 44 30Z"/></svg>
        </button>

        <footer class="zk-footer">
          <span><i></i><span data-sky-sync>Sincronizado con tu hora</span></span>
          <span data-sky-date>Tu espacio personal</span>
        </footer>
      </div>
    </section>
  </template>

  <dialog id="dialog"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./sky.mjs"></script>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
